<!doctype html>
<html class="page" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Гладченко Виталий Владимирович - ГЛАДКОВЕР</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #102a43;
            --accent: #e30613;
            --text-main: #102a43;
            --text-muted: #486581;
            --bg-gradient: linear-gradient(135deg, #f0f4f8 0%, #d9e2ec 100%);
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(255, 255, 255, 0.5);
        }

        .page {
            min-width: 280px;
            overflow-x: hidden;
            overflow-y: scroll;
            cursor: default;
        }

        .page__body {
            margin: 0;
            font-weight: 400;
            font-size: 16px;
            line-height: 1.5;
            font-family: 'Montserrat', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            min-height: 100vh;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page * {
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 20px;
        }

        .badge {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 32px;
            padding: 48px 24px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            position: relative;
            text-align: center;
        }

        .badge__picture-container {
            width: 180px;
            height: 180px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        .picture__img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            border-radius: 50%;
            border: 6px solid #fff;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            background-color: #f0f4f8;
        }

        .badge__title {
            margin: 28px 0 28px;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--primary);
            line-height: 1.2;
        }


        .badge__company-container {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 32px;
        }

        .badge__logo {
            width: 100%;
            max-width: 280px;
            height: auto;
            margin-bottom: 20px;
            background: #ffffff;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .badge__company-description {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 20px;
            font-weight: 500;
            text-align: center;
        }

        .badge__company-address-link {
            display: inline-flex;
            align-items: flex-start;
            text-align: left;
            color: var(--primary);
            font-size: 12px;
            text-decoration: none;
            font-weight: 600;
            gap: 10px;
            background: #fff;
            padding: 12px 16px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s;
            line-height: 1.4;
        }

        .badge__company-address-link:hover {
            transform: translateY(-2px);
        }

        .badge__company-address-link i {
            color: var(--accent);
            margin-top: 2px;
        }

        .badge__contacts-list {
            margin: 0 0 32px;
            padding: 0;
            list-style: none;
        }

        .badge__contacts-item {
            margin-bottom: 12px;
        }

        .badge__contacts-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 700;
        }

        .badge__contacts-link_type_phone {
            font-size: 22px;
            display: block;
        }

        .badge__contacts-link_type_email {
            color: var(--text-muted);
            font-size: 15px;
        }

        .badge__contacts-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 24px;
        }

        .badge__contacts-icon {
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            background: #fff;
        }

        .badge__contacts-icon:hover {
            transform: translateY(-5px) scale(1.05);
        }

        .badge__contacts-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .badge__button {
            display: block;
            width: 100%;
            background: #2F2F2F;
            color: #fff;
            text-decoration: none;
            padding: 18px;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s;
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .badge__button:hover {
            background: #1f1f1f;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

        .badge__qr-container {
            margin-top: 40px;
            padding-top: 32px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        .badge__qr-title {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .badge__qr-img {
            width: 130px;
            height: 130px;
            background: #fff;
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        @media (max-width: 400px) {
            .badge {
                padding: 32px 16px;
            }
            .badge__picture-container {
                width: 150px;
                height: 150px;
            }
            .badge__title {
                font-size: 20px;
            }
        }
    </style>
</head>
